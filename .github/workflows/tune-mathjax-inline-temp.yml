name: Tune MathJax inline temp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Tune inline MathJax
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('scripts/essay_template.html')
          text = template.read_text(encoding='utf-8')
          old = '''mjx-container:not([display="true"]){
            max-width:100%;
            overflow-x:auto;
            overflow-y:hidden;
            vertical-align:-.04em;
            font-size:95%;
          }'''
          new = '''mjx-container:not([display="true"]){
            max-width:100%;
            overflow-x:auto;
            overflow-y:hidden;
            vertical-align:.001em;
            font-size:90%;
          }'''
          if old not in text:
              raise SystemExit('expected inline MathJax block not found')
          template.write_text(text.replace(old, new, 1), encoding='utf-8')

          js = Path('scripts/site_src/essay.js')
          text = js.read_text(encoding='utf-8')
          old = '''    'mjx-container:not([display="true"]){vertical-align:-.04em;font-size:95%;}',\n'''
          new = '''    'mjx-container:not([display="true"]){vertical-align:.001em;font-size:90%;}',\n'''
          if old not in text:
              raise SystemExit('expected runtime MathJax rule not found')
          js.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_box_scope_and_mobile_legibility.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('assert "vertical-align:-.04em;" in block\n    assert "font-size:95%;" in block', 'assert "vertical-align:.001em;" in block\n    assert "font-size:90%;" in block', 1)
          text = text.replace("assert 'mjx-container:not([display=\"true\"]){vertical-align:-.04em;font-size:95%;}' in js", "assert 'mjx-container:not([display=\"true\"]){vertical-align:.001em;font-size:90%;}' in js", 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_box_scope_and_mobile_legibility.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/essay_template.html scripts/site_src/essay.js tests/test_box_scope_and_mobile_legibility.py
          git diff --cached --check
          git commit -m 'fix: set MathJax inline baseline and size'
          git push

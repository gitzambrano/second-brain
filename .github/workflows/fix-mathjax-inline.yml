name: Fix MathJax inline baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Patch inline MathJax baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('scripts/essay_template.html')
          text = template.read_text(encoding='utf-8')
          old = '''mjx-container:not([display="true"]){
            max-width:100%;
            overflow-x:auto;
            overflow-y:hidden;
            vertical-align:-.15em;
          }'''
          new = '''mjx-container:not([display="true"]){
            max-width:100%;
            overflow-x:auto;
            overflow-y:hidden;
          }'''
          if old not in text:
              raise SystemExit('expected MathJax inline CSS block not found')
          template.write_text(text.replace(old, new, 1), encoding='utf-8')

          js = Path('scripts/site_src/essay.js')
          text = js.read_text(encoding='utf-8')
          old = '''    'mjx-container:not([display="true"]){vertical-align:-.15em;}',\n'''
          if old not in text:
              raise SystemExit('expected runtime MathJax override not found')
          js.write_text(text.replace(old, '', 1), encoding='utf-8')

          test = Path('tests/test_box_scope_and_mobile_legibility.py')
          text = test.read_text(encoding='utf-8')
          old = '''def test_math_inline_fica_mais_proxima_da_baseline():
              css = TEMPLATE.read_text(encoding="utf-8")
              block = css.split('mjx-container:not([display="true"]){', 1)[1].split("}", 1)[0]
              assert "vertical-align:-.15em;" in block
              assert "vertical-align:-.25em;" not in block
          '''
          new = '''def test_math_inline_deixa_o_mathjax_controlar_a_baseline():
              css = TEMPLATE.read_text(encoding="utf-8")
              block = css.split('mjx-container:not([display="true"]){', 1)[1].split("}", 1)[0]
              assert "vertical-align" not in block
          '''
          if old not in text:
              raise SystemExit('expected MathJax baseline test not found')
          text = text.replace(old, new, 1)
          old = '''    assert 'mjx-container:not([display="true"]){vertical-align:-.15em;}' in js\n'''
          new = '''    assert 'mjx-container:not([display="true"]){vertical-align:' not in js\n'''
          if old not in text:
              raise SystemExit('expected runtime MathJax test not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_box_scope_and_mobile_legibility.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/essay_template.html scripts/site_src/essay.js tests/test_box_scope_and_mobile_legibility.py
          git diff --cached --check
          git commit -m 'fix: let MathJax control inline baseline'
          git push

name: Fix local source manifest checker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-local-source-manifest-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch checker and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_wiki.py')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          out = []
          removed = 0
          i = 0
          while i < len(lines):
              line = lines[i]
              if 'for filename, entry in manifest_entries.items():' in line:
                  out.extend([
                      '        # Raw source documents are intentionally local-only (see data/.gitignore).\n',
                      '        # The durable manifest may therefore outlive the local raw file in a clean clone.\n',
                      '        # Validation is one-way: a present raw source needs a manifest entry; the reverse\n',
                      '        # is not required because raw source bytes are deliberately not versioned.\n',
                  ])
              if 'if filename not in files_on_disk:' in line:
                  if i + 2 >= len(lines) or 'MANIFEST_ENTRY_NO_FILE' not in lines[i + 1]:
                      raise SystemExit('Unexpected MANIFEST_ENTRY_NO_FILE block shape')
                  i += 3
                  removed += 1
                  continue
              out.append(line)
              i += 1
          if removed != 1:
              raise SystemExit(f'Expected one MANIFEST_ENTRY_NO_FILE block, removed={removed}')
          p.write_text(''.join(out), encoding='utf-8')
          PY
          printf '%s' '' | base64 -d > tests/test_manifest_local_sources.py
      - name: Validate regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt
          python -m pytest -q tests/test_manifest_local_sources.py tests/test_checker_selftests.py
          python -m compileall -q scripts
          git diff --check
      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-local-source-manifest-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_wiki.py tests/test_manifest_local_sources.py .github/workflows/fix-local-source-manifest-once.yml
          git commit -m 'Allow manifest provenance for local-only sources'
          git push origin HEAD:main

name: One-shot caption template fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'Retry one-shot caption template fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch template and add regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/essay_template.html')
          text = path.read_text(encoding='utf-8')

          old_picture = '''.content > p:has(> picture:only-child) + p:has(> em:first-child){
            text-align:center;font-size:.84em;color:var(--text-dim);margin-bottom:1.7rem;
          }
          '''
          if old_picture not in text:
              raise SystemExit('expected picture-caption heuristic not found')
          text = text.replace(old_picture, '', 1)

          old_img = '''/* Legenda: parágrafo em itálico logo após uma figura. */
          .content p:has(> img) + p > em{display:block;text-align:center;font-size:.84em;
            color:var(--text-dim);line-height:1.5;margin-bottom:2rem;}
          '''
          new_caption_css = '''/* Legenda identificada semanticamente pelo JS do template. Um <em> no meio
             da prosa pós-imagem nunca muda de display: isso evita quebrar frases como
             "o modelo subestima o <em>sink rate</em> principalmente na cauda". */
          .content p.sb-image-caption{
            text-align:center;font-size:.84em;color:var(--text-dim);
            line-height:1.5;margin-bottom:2rem;
          }
          .content p.sb-image-caption > em{
            display:inline;font-size:inherit;color:inherit;line-height:inherit;margin:0;
          }
          '''
          if old_img not in text:
              raise SystemExit('expected image-caption heuristic not found')
          text = text.replace(old_img, new_caption_css, 1)

          marker = '''  /* Identifica e classifica divisores de capitulo: o losango so aparece onde ha capitulo real */
          '''
          classifier = '''  /* Legendas de figura: só o parágrafo inteiramente em itálico ou um prefixo
             explícito Fig./Figura/Tira é legenda. Itálico incidental em prosa continua
             inline, inclusive quando o parágrafo vem imediatamente depois da imagem. */
          function isImageCaption(paragraph){
            var nodes=[].slice.call(paragraph.childNodes).filter(function(node){
              return !(node.nodeType===3&&!node.textContent.trim());
            });
            var pureEmphasis=nodes.length===1&&nodes[0].nodeType===1&&nodes[0].tagName==='EM';
            var explicitCaption=/^(fig(?:ura)?\\.?\\s*\\d+\\b|tira\\b)/i.test(paragraph.textContent.trim());
            return pureEmphasis||explicitCaption;
          }
          document.querySelectorAll('.content p').forEach(function(paragraph){
            var previous=paragraph.previousElementSibling;
            if(!previous||previous.tagName!=='P')return;
            if(!previous.querySelector(':scope > img, :scope > picture'))return;
            if(isImageCaption(paragraph))paragraph.classList.add('sb-image-caption');
          });
          '''
          if marker not in text:
              raise SystemExit('template JS insertion marker not found')
          text = text.replace(marker, classifier + marker, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_caption_template_contract.py')
          test.write_text('''"""Standalone template must not infer captions from incidental emphasis."""\nfrom pathlib import Path\n\n\ndef test_template_uses_semantic_caption_classification():\n    template = (Path(__file__).resolve().parents[1] / "scripts" / "essay_template.html").read_text(encoding="utf-8")\n    assert ".content p:has(> img) + p > em{display:block" not in template\n    assert ".content > p:has(> picture:only-child) + p:has(> em:first-child)" not in template\n    assert ".content p.sb-image-caption" in template\n    assert "function isImageCaption(paragraph)" in template\n    assert "paragraph.classList.add('sb-image-caption')" in template\n''', encoding='utf-8')
          PY

          git rm .github/workflows/oneshot-caption-template-fix.yml
          python -m pip install -q pytest ruff
          ruff check tests/test_caption_template_contract.py
          python -m pytest -q tests/test_caption_template_contract.py

      - name: Commit tested source fix
        run: |
          git config user.name "Gustavo Zambrano"
          git config user.email "gustavozambrano@gmail.com"
          git add scripts/essay_template.html tests/test_caption_template_contract.py
          git commit -m "Fix standalone image-caption classification"
          git push

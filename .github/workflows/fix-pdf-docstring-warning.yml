name: Fix Python docstring warnings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Make backslash-heavy docstrings raw
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/export_essay_pdf.py'): (
                  '#!/usr/bin/env python3\n"""\nexport_essay_pdf.py',
                  '#!/usr/bin/env python3\nr"""\nexport_essay_pdf.py',
              ),
              Path('scripts/stats.py'): (
                  'def get_frontmatter_field(content, field):\n    """Extrator YAML-ish',
                  'def get_frontmatter_field(content, field):\n    r"""Extrator YAML-ish',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected docstring opening not found: {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate every script with SyntaxWarning as error
        run: |
          python - <<'PY'
          import warnings
          from pathlib import Path

          with warnings.catch_warnings():
              warnings.simplefilter('error', SyntaxWarning)
              for path in sorted(Path('scripts').glob('*.py')):
                  compile(path.read_text(encoding='utf-8-sig'), str(path), 'exec')
          PY
          python -m pytest -q tests/test_script_defaults.py::test_scripts_compile_without_syntax_warnings
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/export_essay_pdf.py scripts/stats.py
          git diff --cached --check
          git commit -m 'fix: make backslash-heavy docstrings raw'
          git push

name: Repository sanity

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      # A árvore inteira, não uma lista de arquivos escolhidos a dedo. As
      # exceções vivem em `[tool.ruff.lint.per-file-ignores]` do pyproject,
      # nomeadas e justificadas.
      - name: Ruff
        run: ruff check .
      - name: Nested-Git and path discipline
        run: |
          python scripts/repo_paths.py
          python scripts/check_git_isolation.py
          python scripts/check_path_discipline.py
      # Os espelhos .claude/ são derivados e gitignorados, então um clone novo
      # não os tem. Gerá-los aqui é o mesmo bootstrap que o hook SessionStart
      # faz na máquina do autor. Os adapters .codex/, ao contrário, são
      # versionados: se o sync precisar alterá-los, `git diff` reprova o job e
      # impede que uma cópia stale seja mascarada pelo próprio bootstrap.
      - name: Generate agent mirrors (.agents -> harness adapters)
        run: |
          python scripts/sync_skills.py --quiet
          git diff --exit-code -- .codex/agents
      - run: python scripts/check_repo.py --quick
      # `browser` também fica de fora: o job não instala Chromium nem Pandoc, e
      # a auditoria visual tem job próprio (`site-browser`). Sem esta exclusão
      # os testes de browser rodavam aqui e falhavam por falta de Pandoc.
      - run: python -m pytest -q -m "not html and not pdf and not slow and not browser"

  corpus-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q tests/test_wiki_checks.py

  html-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m html

  pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-luatex texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q -m pdf

  site-browser:
    # A auditoria visual precisa de Chromium, e o job `core` não instala nenhum
    # — foi essa mistura que deixava o CI vermelho por um motivo que não era o
    # do teste. Aqui o navegador é o ponto: home clara, home escura, home
    # mobile, essay nos três, e os dois mapas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      # `--basetemp` fixa onde o pytest escreve, senão as capturas ficam num
      # `/tmp/pytest-of-runner/pytest-N/` que o upload não sabe encontrar. O
      # destino tem de ser um diretório cujo PAI já exista: o pytest cria o
      # último nível, não a árvore. `artifacts/pytest` quebrava os 10 testes no
      # setup, antes de qualquer navegador abrir, porque `artifacts/` não
      # existia no checkout. `runner.temp` existe sempre.
      - name: Build the fixture site and audit it in a real browser
        run: >-
          python -m pytest -q -m browser
          --basetemp="${{ runner.temp }}/site-browser"
          --junitxml="${{ runner.temp }}/site-browser.xml"
      # Um marcador digitado errado, ou um `pytestmark` que suma num refactor,
      # faz o pytest não selecionar nada — e um job que não roda teste nenhum
      # passa em silêncio. O gate visual precisa provar que rodou.
      - name: Prove the visual gate actually ran
        if: always()
        run: |
          python - "${{ runner.temp }}/site-browser.xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse(sys.argv[1]).getroot()
          suites = raiz.iter("testsuite") if raiz.tag == "testsuites" else [raiz]
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"testes de browser executados: {total}")
          if total < 1:
              sys.exit("o gate visual nao executou nenhum teste")
          EOF
      # As capturas são o que serve para olhar quando uma regressão visual
      # aparece — `if: always()` porque é justamente no job vermelho que elas
      # importam.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: ${{ runner.temp }}/site-browser/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

name: Repository sanity

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      # A árvore inteira, não uma lista de arquivos escolhidos a dedo. As
      # exceções vivem em `[tool.ruff.lint.per-file-ignores]` do pyproject,
      # nomeadas e justificadas.
      - name: Ruff
        run: ruff check .
      - name: Nested-Git and path discipline
        run: |
          python scripts/repo_paths.py
          python scripts/check_git_isolation.py
          python scripts/check_path_discipline.py
      # Os espelhos .claude/ são derivados e gitignorados, então um clone novo
      # não os tem. Gerá-los aqui é o mesmo bootstrap que o hook SessionStart
      # faz na máquina do autor; o --check dentro de check_repo.py em seguida
      # prova que .agents/ sozinho reproduz o espelho inteiro.
      - name: Generate agent mirrors (.agents -> .claude)
        run: python scripts/sync_skills.py --quiet
      - run: python scripts/check_repo.py --quick
      - run: python -m pytest -q -m "not html and not pdf and not slow"

  corpus-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q tests/test_wiki_checks.py

  html-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m html

  pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-luatex texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q -m pdf

  site-browser:
    # A auditoria visual precisa de Chromium, e o job `core` não instala nenhum
    # — foi essa mistura que deixava o CI vermelho por um motivo que não era o
    # do teste. Aqui o navegador é o ponto: home clara, home escura, home
    # mobile, essay nos três, e os dois mapas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the fixture site and audit it in a real browser
        run: python -m pytest -q -m browser

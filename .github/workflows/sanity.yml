name: Repository sanity

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install pytest ruff PyYAML PyMuPDF beautifulsoup4 html5lib playwright Unidecode
      - name: Ruff maintained quality layer
        run: >-
          ruff check
          scripts/repo_paths.py scripts/check_repo.py scripts/check_git_isolation.py
          scripts/check_path_discipline.py scripts/build_site.py
          scripts/check_site_privacy.py scripts/render_public_essay.py
          scripts/lib/render_public_essay.py scripts/lib/build_public_map.py
          tests/test_site_theme_contract.py tests/test_workflow_integrity.py
      - name: Nested-Git and path discipline
        run: |
          python scripts/repo_paths.py
          python scripts/check_git_isolation.py
          python scripts/check_path_discipline.py
      - run: python scripts/check_repo.py --quick
      - run: python -m pytest -q -m "not html and not pdf and not slow"

  corpus-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ruff PyYAML PyMuPDF beautifulsoup4 html5lib playwright Unidecode
      - run: python -m pytest -q tests/test_wiki_checks.py

  html-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python -m pip install pytest ruff PyYAML PyMuPDF beautifulsoup4 html5lib playwright Unidecode
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m html

  pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-luatex texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python -m pip install pytest ruff PyYAML PyMuPDF beautifulsoup4 html5lib playwright Unidecode
      - run: python -m pytest -q -m pdf

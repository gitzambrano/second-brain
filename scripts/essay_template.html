<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
$if(math)$
$math$
$endif$
<style>
:root{
  --title-blue:#1E3A5F;
  --link-blue:#2563EB;
  --subtle-gray:#6B7280;
  --rule-gray:#E5E7EB;
  --code-bg:#F4F5F7;
  --callout-bg:#F8FAFC;
  --page-bg:#FFFFFF;
  --text:#1F2937;
  --max-width:760px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  padding:0;
  background:var(--page-bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
  line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
.essay-shell{
  max-width:var(--max-width);
  margin:0 auto;
  padding:64px 24px 96px;
}
header.essay-header{
  margin-bottom:2.6em;
  text-align:center;
}
header.essay-header h1{
  font-family:Georgia,serif;
  font-size:2.15em;
  line-height:1.25;
  color:var(--title-blue);
  margin:0 0 0.5em;
}
.essay-subtitle{
  color:var(--subtle-gray);
  font-size:1.05em;
  font-style:italic;
  margin:0 0 0.35em;
}
.essay-byline{
  color:var(--subtle-gray);
  font-size:0.92em;
  margin:0;
}
header.essay-header hr{
  border:none;
  border-top:1px solid var(--rule-gray);
  width:72px;
  margin:1.6em auto 0;
}
h1,h2,h3,h4,h5,h6{
  font-family:Georgia,serif;
  color:var(--title-blue);
  line-height:1.3;
  margin:1.7em 0 0.6em;
}
h2{font-size:1.5em;border-bottom:1px solid var(--rule-gray);padding-bottom:0.25em;}
h3{font-size:1.22em;color:color-mix(in srgb, var(--title-blue) 80%, black);}
h4{font-size:1.05em;color:color-mix(in srgb, var(--title-blue) 65%, black);}
p{margin:0 0 1.05em;}
a{color:var(--link-blue);text-decoration:none;border-bottom:1px solid rgba(37,99,235,0.35);}
a:hover{border-bottom-color:var(--link-blue);}
strong{color:var(--text);}
em{font-style:italic;}
ul,ol{margin:0 0 1.05em;padding-left:1.4em;}
li{margin-bottom:0.35em;}
blockquote{
  margin:1.4em 0;
  padding:0.9em 1.3em;
  background:var(--callout-bg);
  border-left:4px solid var(--title-blue);
  border-radius:0 6px 6px 0;
  color:var(--text);
  font-size:0.97em;
}
blockquote p:last-child{margin-bottom:0;}
code{
  font-family:"Consolas","SFMono-Regular",Menlo,monospace;
  background:var(--code-bg);
  padding:0.15em 0.4em;
  border-radius:4px;
  font-size:0.85em;
}
pre{
  background:var(--code-bg);
  padding:1em 1.2em;
  border-radius:8px;
  overflow-x:auto;
  font-size:0.85em;
  line-height:1.5;
  border:1px solid var(--rule-gray);
}
pre code{background:none;padding:0;}
figure{margin:2em 0;text-align:center;}
figure img{max-width:100%;height:auto;border-radius:6px;}
figcaption{
  margin-top:0.6em;
  font-size:0.85em;
  color:var(--subtle-gray);
  font-style:italic;
}
img{max-width:100%;height:auto;}
table{
  width:100%;
  border-collapse:collapse;
  margin:1.6em 0;
  font-size:0.92em;
}
th,td{
  border:1px solid var(--rule-gray);
  padding:0.55em 0.75em;
  text-align:left;
}
th{background:var(--code-bg);color:var(--title-blue);}
hr{border:none;border-top:1px solid var(--rule-gray);margin:2.4em 0;}
/* Sumário: first <ul> following the "Sumário" heading gets a nav look */
#sumário + ul, #sumario + ul{
  list-style:none;
  padding-left:0;
  background:var(--callout-bg);
  border-radius:8px;
  padding:1em 1.4em;
}
#sumário + ul li, #sumario + ul li{margin-bottom:0.5em;}
#sumário + ul a, #sumario + ul a{border-bottom:none;}
::selection{background:rgba(37,99,235,0.18);}
@media (max-width:640px){
  body{font-size:17px;}
  .essay-shell{padding:40px 18px 72px;}
  header.essay-header h1{font-size:1.6em;}
  h2{font-size:1.28em;}
  h3{font-size:1.1em;}
  pre{font-size:0.78em;padding:0.85em;}
}
@media print{
  body{font-size:12pt;}
  a{color:inherit;border-bottom:none;}
  .essay-shell{max-width:100%;padding:0;}
}
$if(highlighting-css)$
$highlighting-css$
$endif$
</style>
</head>
<body>
<div class="essay-shell">
<header class="essay-header">
<h1>$title$</h1>
$if(subtitle)$
<p class="essay-subtitle">$subtitle$</p>
$endif$
$if(author)$
<p class="essay-byline">$for(author)$$author$$sep$, $endfor$</p>
$endif$
<hr>
</header>
<article>
$body$
</article>
</div>
</body>
</html>

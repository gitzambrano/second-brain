<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<meta property="og:title" content="$title$">
$if(summary)$
<meta property="og:description" content="$summary$">
$endif$
<meta property="og:type" content="article">
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
$if(math)$
$math$
$endif$
<style>
/* ------------------------------------------------------------------ */
/* Tokens: mobile = escuro editorial (padrao)                          */
/*         desktop = claro/branco (menos rebuscado), toggle sobrepoe   */
/* ------------------------------------------------------------------ */
:root{
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --bg:#0A0A0A;
  --surface:#111111;
  --surface2:#181818;
  --border:#2A2A2A;
  --text:#D4CFC8;
  --text-dim:#8A857E;
  --text-bright:#EDE8DF;
  --gold:#C9922A;
  --gold-dim:#8A6520;
  --rust:#A03C28;
  --rust-bright:#C44A30;
  --accent:#4A8FA8;
  --amber:#B07A1E;
  --max-width:700px;
}
[data-theme="light"]{
  --bg:#FFFFFF;
  --surface:#F6F3EC;
  --surface2:#EDE9DE;
  --border:#DCD5C5;
  --text:#3A342B;
  --text-dim:#7E7566;
  --text-bright:#171310;
  --gold:#96690F;
  --gold-dim:#B08A2E;
  --rust:#A03C28;
  --rust-bright:#B4432C;
  --accent:#35708A;
  --amber:#8F6212;
}
@media (min-width:901px){
  /* Desktop: coluna larga (~70% da tela) em AMBOS os temas — antes o override
     valia só para o claro e o escuro ficava preso nos 700px da base,
     virando uma faixa estreita no centro. Cores/serifas continuam
     por tema: claro/branco por padrao, data-theme="dark" devolve o
     editorial escuro para quem preferir. */
  :root{
    --max-width:70vw;
  }
  :root:not([data-theme="dark"]){
    --bg:#FFFFFF;
    --surface:#F7F5EF;
    --surface2:#EEEAE0;
    --border:#D9D3C4;
    --text:#33302B;
    --text-dim:#7E7566;
    --text-bright:#15120E;
    --gold:#8F6510;
    --gold-dim:#A98A2E;
    --rust:#A03C28;
    --rust-bright:#B4432C;
    --accent:#35708A;
    --amber:#8F6212;
    --font-display:Georgia,'Times New Roman',serif;
  }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:hidden;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Source Serif 4',Georgia,'Times New Roman',serif;
  font-size:17.5px;
  line-height:1.78;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}

/* ------------------------------------------------------------------ */
/* Chrome fixo: progresso / tema / topo                                */
/* ------------------------------------------------------------------ */
.sb-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:transparent;}
.sb-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--rust),var(--gold));}
#sbThemeToggle{
  position:fixed;top:14px;right:14px;z-index:61;width:38px;height:38px;
  border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--gold);font-size:1rem;cursor:pointer;transition:border-color .15s,color .15s;
}
#sbThemeToggle:hover{border-color:var(--gold);}
#sbToTop{
  position:fixed;bottom:22px;right:18px;z-index:61;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);font-size:1rem;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .25s,border-color .15s;
}
#sbToTop.visible{opacity:1;pointer-events:auto;}
#sbToTop:hover{border-color:var(--gold);color:var(--gold);}

/* ------------------------------------------------------------------ */
/* Masthead                                                            */
/* ------------------------------------------------------------------ */
.masthead{background:var(--surface);border-bottom:1px solid var(--border);text-align:center;}
.stripe{height:4px;background:linear-gradient(90deg,var(--rust) 0%,var(--gold) 50%,var(--rust) 100%);}
.masthead-inner{max-width:var(--max-width);margin:0 auto;padding:2.4rem 1.2rem 2rem;}
.journal-label{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:1.4rem;
}
.hero-title{
  font-family:var(--font-display);
  font-size:clamp(2.1rem,8.5vw,4.4rem);
  font-weight:900;line-height:1.05;color:var(--text-bright);
  letter-spacing:-.02em;text-wrap:balance;
}
.hero-title em{font-style:italic;color:var(--gold);}
/* Desktop: titulo menor — o clamp mobile-first estourava em telas largas. */
@media (min-width:901px){
  .hero-title{font-size:clamp(2rem,4.6vw,3.05rem);}
}
.masthead-rule{border:none;border-top:1px solid var(--border);width:110px;margin:1.5rem auto 1.1rem;}
.byline{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);
}

/* ------------------------------------------------------------------ */
/* Conteudo                                                            */
/* ------------------------------------------------------------------ */
.content{max-width:var(--max-width);margin:0 auto;padding:2.8rem 1.2rem 5rem;}

h1,h2,h3,h4,h5,h6{font-family:var(--font-display);color:var(--text-bright);line-height:1.25;}
.content h1{display:none;} /* titulo vive no masthead */

.content{counter-reset:sb-h2;}
.content h2{
  counter-increment:sb-h2;
  font-size:clamp(1.45rem,4.6vw,2rem);font-weight:700;
  margin:3.4rem 0 1.4rem;letter-spacing:-.01em;text-wrap:balance;
}
.content h2::before{
  content:"CAPÍTULO " counter(sb-h2,decimal-leading-zero);
  display:block;font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.78rem;font-weight:400;letter-spacing:.18em;
  color:var(--gold);margin-bottom:.55rem;
}
.content h2::after{
  content:"";display:block;width:42px;height:2px;background:var(--rust);
  margin-top:.85rem;
}
.content h2#sumário{display:none;}
.content h2#sumário::before,.content h2#sumário::after{display:none;}
/* Seções sem número de capítulo: Introdução, Conclusão etc. recebem
   data-label via JS; Referências é rotulada pelo próprio nome. */
.content h2.no-chapter{counter-increment:none;}
.content h2[data-label]::before{content:attr(data-label);}
.content h2#referências{counter-increment:none;}
.content h2#referências::before{content:"REFERÊNCIAS";}
h3{font-size:1.18rem;margin:2rem 0 .8rem;color:color-mix(in srgb,var(--text-bright) 88%,transparent);}

p{margin:0 0 1.25rem;hyphens:auto;word-break:break-word;}
a{color:var(--gold);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--gold) 40%,transparent);transition:border-color .15s,color .15s;}
a:hover{color:var(--text-bright);border-bottom-color:var(--text-bright);}
strong{color:var(--text-bright);font-weight:600;}

/* Ensaios com capitulos auto-numerados no proprio titulo ("## I. ..." /
   "## 3. ..."): o JS esconde o numero do titulo (span.sb-selfnum) e o
   promove a rotulo dourado — CAPITULO N extraido do proprio texto;
   secoes semanticas (Introducao/Conclusao...) recebem a palavra; h2 sem
   numero e sem palavra semantica fica sem kicker. */
.content.self-numbered h2:not([data-label])::before{content:none;}
.content .sb-selfnum{display:none;}

/* Listas: o reset global zera o padding da UA — sem isto, os marcadores
   (position:outside) penduram alem da borda e saem da tela no mobile. */
ul,ol{margin:0 0 1.05em;padding-left:1.7em;}
li{margin-bottom:.35em;}
li::marker{color:var(--gold-dim);}
/* Listas dentro de componentes: alinhadas com o recuo do texto */
.box :is(ul,ol),.card :is(ul,ol),.quote :is(ul,ol){
  margin:.4rem 1.3rem 1rem;padding-left:1.5em;
}
/* Headings dentro de caixas: mesmo recuo dos paragrafos (sem isso ficam
   colados na borda enquanto o texto tem 1.3rem — recuo esquisito) */
.box > :is(h3,h4,h5){margin:1.1rem 1.3rem .45rem;}
.card > :is(h3,h4,h5){margin:.6rem 0 .45rem;}

/* Ancora discreta nos titulos */
.hlink{border-bottom:none;margin-left:.45rem;font-size:.6em;vertical-align:.35em;color:var(--border);transition:color .15s;}
.hlink:hover{color:var(--gold);}

hr{border:none;border-top:1px solid var(--border);margin:2.6rem 0;}

/* ------------------------------------------------------------------ */
/* Sumario                                                             */
/* ------------------------------------------------------------------ */
#sumário + ul{
  list-style:none;counter-reset:sb-toc;
  background:var(--surface);border:1px solid var(--border);
  padding:1.5rem 1.4rem;margin:2.2rem 0;
}
#sumário + ul::before{
  content:"ÍNDICE";display:block;text-align:center;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.78rem;letter-spacing:.18em;color:var(--gold);margin-bottom:1rem;
}
#sumário + ul li{
  counter-increment:sb-toc;display:flex;gap:.7rem;align-items:baseline;
  font-size:.88rem;line-height:1.5;margin-bottom:.5rem;
}
#sumário + ul li::before{
  content:counter(sb-toc,upper-roman);
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.56rem;color:var(--gold);min-width:1.7rem;flex-shrink:0;
}
/* Titulos ja numerados no proprio texto ("## I. ..."): o contador do
   indice duplicaria/mascalaria a numeracao — some. */
#sumário + ul.sb-toc-plain li{gap:0;}
#sumário + ul.sb-toc-plain li::before{content:none;}
#sumário + ul a{border-bottom:1px solid var(--border);color:var(--text);}
#sumário + ul a:hover{color:var(--gold);border-bottom-color:var(--gold);}

/* ------------------------------------------------------------------ */
/* Citacoes                                                            */
/* ------------------------------------------------------------------ */
.quote{
  margin:2rem 0;padding:1.05rem 1.3rem;
  background:var(--surface2);border-left:2px solid var(--gold-dim);
}
.quote p{font-size:.97rem;color:var(--text);margin-bottom:1rem;}
.quote p:last-child{margin-bottom:0;}

.pull-quote{
  margin:2.4rem 0;padding:1.35rem 1.4rem 1.2rem;
  background:var(--surface);border-left:3px solid var(--gold);
}
/* Mesma fonte e corpo da .quote — a distincao fica na borda e no fundo,
   nao no tamanho (citacoes do mesmo essay nao podem parecer componentes
   diferentes). */
.pull-quote p{
  font-style:italic;
  font-size:.97rem;line-height:1.72;color:var(--text);
  margin-bottom:1rem;
}
.pq-cite{
  font-size:.85rem;color:var(--text-dim);font-style:normal;
}

/* ------------------------------------------------------------------ */
/* Caixas tipadas                                                      */
/* ------------------------------------------------------------------ */
.box{
  --boxc:var(--gold);
  margin:2.6rem 0;border:1px solid var(--border);
  background:color-mix(in srgb,var(--boxc) 4%,var(--surface));
  overflow:hidden;
}
.box.experimento{--boxc:var(--rust);}
.box.evidencia{--boxc:var(--accent);}
.box.mapa{--boxc:var(--gold);}
.box.ataque{--boxc:var(--rust);}
.box.aviso{--boxc:var(--amber);}
.box.nivel{--boxc:var(--accent);}
.box.ideia{--boxc:var(--gold-dim);}
.box.generico{--boxc:var(--gold-dim);}

.box-badge{
  display:inline-block;background:var(--boxc);color:#fff;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  padding:.28rem .75rem;
}
.box-title{
  font-family:var(--font-display);font-weight:700;
  font-size:1rem;line-height:1.35;color:var(--text-bright);
  padding:1rem 1.3rem .3rem;
}
.box > p{font-size:.95rem;line-height:1.72;margin:0 0 1rem;padding:0 1.3rem;color:var(--text);}
.box > p:last-of-type{margin-bottom:1.2rem;}
.box-title p,.box-badge p{margin:0;padding:0;}

.box-verdict{
  margin-top:1.3rem;padding:1rem 1.3rem 1.05rem;
  background:var(--surface2);
  border-top:1px solid var(--border);
}
.box-verdict p{margin:0 0 .7rem;font-size:.92rem;color:var(--text-bright);}
.verdict-tag{
  display:block;font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);margin-bottom:.5rem;
}

/* Cards: filosofos e obras */
.card{
  margin:2.1rem 0;padding:1.15rem 1.3rem;
  background:var(--surface);border-left:3px solid var(--gold-dim);
}
.card-name{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--text-bright);}
.card.livro .card-name{font-style:italic;}
.card-meta{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.72rem;letter-spacing:.05em;
  color:var(--text-dim);margin:.25rem 0 .75rem;
}
.card p{font-size:.95rem;line-height:1.7;margin-bottom:.7rem;}
.card p:last-child{margin-bottom:0;}

/* Rotulo solto / ornamento */
.label-solo{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin:2.3rem 0 .9rem;
}
.ornament{
  text-align:center;margin:2.7rem 0;color:var(--text-dim);opacity:.6;
  letter-spacing:.9em;padding-left:.9em;font-size:1.02rem;
}

/* ------------------------------------------------------------------ */
/* Tabelas / codigo / figuras                                          */
/* ------------------------------------------------------------------ */
table{width:100%;border-collapse:collapse;margin:2rem 0;font-size:.95rem;}
th{
  background:var(--surface2);color:var(--gold);text-align:left;
  font-family:'JetBrains Mono',Consolas,monospace;font-weight:500;
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.65rem .8rem;border-bottom:1px solid var(--border);
}
td{padding:.65rem .8rem;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55;}
tr:last-child td{border-bottom:none;}

code{
  font-family:'JetBrains Mono',Consolas,monospace;
  background:var(--surface2);padding:.15em .4em;border-radius:4px;font-size:.82em;
}
pre{
  background:var(--surface2);border:1px solid var(--border);
  padding:1em 1.2em;border-radius:6px;overflow-x:auto;
  font-size:.8em;line-height:1.55;
}
pre code{background:none;padding:0;}

/* MathJax (saida SVG): equacoes nunca podem empurrar a largura da pagina.
   Display mantem o tamanho e rola internamente; inline escala para caber
   (scrollbar no meio de uma frase e pior que fonte menor). */
mjx-container{max-width:100%;}
mjx-container[display="true"]{
  display:block;
  overflow-x:auto;
  overflow-y:hidden;
  padding-bottom:.3rem;
}
mjx-container:not([display="true"]) svg{max-width:100%;height:auto;}

figure{margin:2.2rem 0;text-align:center;}
figure img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--border);}
figcaption{margin-top:.7rem;font-size:.84em;color:var(--text-dim);font-style:italic;}
img{max-width:100%;height:auto;}

/* Notas de rodape */
.footnotes hr{display:none;}
.footnotes{border-top:1px solid var(--border);margin-top:3.5rem;padding-top:1.6rem;}
.footnotes ol{padding-left:1.4rem;font-size:.83rem;color:var(--text-dim);line-height:1.65;}
.footnotes li{margin-bottom:.6rem;}

::selection{background:color-mix(in srgb,var(--gold) 30%,transparent);}

/* ------------------------------------------------------------------ */
/* Responsivo                                                          */
/* ------------------------------------------------------------------ */
@media (max-width:640px){
  body{font-size:16.5px;}
  .masthead-inner{padding:1.9rem 1rem 1.6rem;}
  .content{padding:2rem 1.05rem 4rem;}
  .content h2{margin-top:2.7rem;}
  pre{font-size:.72em;}
  /* Tabela larga rola dentro de si mesma em vez de estourar o viewport. */
  table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .quote,.card{padding:.95rem 1.05rem;}
  .box > p{margin-left:1.05rem;margin-right:1.05rem;}
  .box-title{padding:1rem 1.05rem .3rem;}
  .box-verdict{padding:.95rem 1.05rem 1rem;}
}

/* ------------------------------------------------------------------ */
/* Impressao                                                           */
/* ------------------------------------------------------------------ */
@media print{
  :root{
    --bg:#fff;--surface:#fff;--surface2:#F5F2EA;--border:#CCC5B4;
    --text:#222;--text-dim:#666;--text-bright:#000;
    --gold:#8A6410;--gold-dim:#A98A2E;--rust:#8A3322;--rust-bright:#8A3322;
    --accent:#2C6076;--amber:#7A5A10;
  }
  body{font-size:11pt;background:#fff;}
  .sb-progress,#sbThemeToggle,#sbToTop,.hlink{display:none !important;}
  .masthead{border-bottom:1px solid var(--border);}
  .content{max-width:100%;padding:1.5rem 0 0;}
  a{color:inherit;border-bottom:none;}
  .box,.card,.pull-quote,.quote{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .box-verdict{break-inside:avoid;}
  h2{break-after:avoid;}
}
$if(highlighting-css)$
$highlighting-css$
$endif$
</style>
</head>
<body>
<div class="sb-progress"><div class="sb-progress-fill" id="sb-progress-fill"></div></div>
<button id="sbThemeToggle" title="Alternar tema" aria-label="Alternar tema">◐</button>

<header class="masthead">
  <div class="stripe"></div>
  <div class="masthead-inner">
    <p class="journal-label">$if(subtitle)$$subtitle$$else$Second Brain$endif$</p>
    <h1 class="hero-title">$title$</h1>
    <hr class="masthead-rule">
    <p class="byline">$author$</p>
  </div>
</header>

<main class="content">
$body$
</main>

<footer style="text-align:center;padding:0 1rem 4rem;">
  <div class="ornament">· · ·</div>
  <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);">
    Second Brain · $author$
  </p>
</footer>

<button id="sbToTop" title="Voltar ao topo" aria-label="Voltar ao topo">↑</button>

<script>
(function(){
  "use strict";
  /* Progresso de leitura */
  var fill=document.getElementById("sb-progress-fill");
  function onScroll(){
    var h=document.documentElement;
    var max=h.scrollHeight-h.clientHeight;
    fill.style.width=(max>0?(h.scrollTop/max)*100:0)+"%";
    toTop.classList.toggle("visible",h.scrollTop>600);
  }
  /* Tema: inverte o tema EFETIVO (considerando o padrao do dispositivo:
     claro no desktop, escuro no mobile) e persiste a escolha. */
  var root=document.documentElement,tgl=document.getElementById("sbThemeToggle");
  try{var saved=localStorage.getItem("sb-theme");if(saved){root.setAttribute("data-theme",saved);}}catch(e){}
  function effectiveTheme(){
    var a=root.getAttribute("data-theme");
    if(a)return a;
    return window.matchMedia("(min-width:901px)").matches?"light":"dark";
  }
  tgl.addEventListener("click",function(){
    var next=effectiveTheme()==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem("sb-theme",next);}catch(e){}
  });
  /* Voltar ao topo */
  var toTop=document.getElementById("sbToTop");
  toTop.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
  window.addEventListener("scroll",onScroll,{passive:true});
  onScroll();
  /* Ancoras discretas nos capitulos */
  document.querySelectorAll(".content h2[id]").forEach(function(h){
    var a=document.createElement("a");
    a.className="hlink";a.href="#"+h.id;a.textContent="§";
    a.setAttribute("aria-label","Link para esta seção");
    h.appendChild(a);
  });
  /* Capitulos auto-numerados no fonte ("## I. ..." / "## 3. ..."):
     o contador CAPITULO NN sai (duplicaria a numeracao); o numero do
     titulo vira o proprio rotulo dourado e some do texto (span.sb-selfnum). */
  var content=document.querySelector(".content");
  var h2s=content?content.querySelectorAll("h2:not(#sumário):not(#referências)"):[];
  var selfNum=Array.prototype.some.call(h2s,function(h){
    return /^\s*(?:\d+|[IVXLC]+)[.\s—–:-]/.test(h.textContent);
  });
  if(selfNum&&content){
    content.classList.add("self-numbered");
    var toc=document.querySelector("#sum\u00e1rio + ul");
    if(toc){toc.classList.add("sb-toc-plain");}
  }
  /* Rotulos semanticos: Introducao/Conclusao/Prefacio etc. recebem a
     propria palavra (data-label), com ou sem numero na frente do titulo. */
  var SECTION_RE=/^\s*(?:(?:\d+|[IVXLC]+)[.\s—–:-]+)?(introdu[çc][aã]o|conclus[aã]o|pref[áa]cio|pr[óo]logo|ep[íi]logo|posf[áa]cio|p[óo]s-?escrito|agradecimentos|ap[êe]ndice)\b/i;
  /* Esconde o numero a esquerda do titulo ("3. Dinamica" -> "Dinamica") e
     devolve o numero para virar kicker. O lookahead (?!\d) evita partir
     numero de subsecao ("2.3 Titulo" fica intocado, sem kicker). */
  function stripSelfNumber(h){
    var n=h.firstChild;
    while(n&&n.nodeType!==3){n=n.nextSibling;}
    if(!n){return null;}
    var m=/^\s*((?:\d+|[IVXLC]+))([.\s—–:-]+)(?!\d)([\s\S]*)/.exec(n.data);
    if(!m){return null;}
    var span=document.createElement("span");
    span.className="sb-selfnum";
    span.setAttribute("aria-hidden","true");
    span.textContent=m[1]+m[2];
    n.data=m[3];
    h.insertBefore(span,n);
    return m[1];
  }
  Array.prototype.forEach.call(h2s,function(h){
    var sem=SECTION_RE.exec(h.textContent);
    var num=selfNum?stripSelfNumber(h):null;
    if(sem){
      h.setAttribute("data-label",sem[1].toUpperCase());
      h.classList.add("no-chapter");
    }else if(num){
      /* Zero à esquerda para casar com o estilo decimal-leading-zero do
         contador dos essays nao-numerados ("CAPITULO 03"). Regex sem o
         cifrao: o compilador de templates do pandoc o trata como abertura
         de expressao. */
      var pad=/^[0-9]/.test(num)&&num.length<2?"0"+num:num;
      h.setAttribute("data-label","CAPÍTULO "+pad);
    }
  });
})();
</script>
</body>
</html>
